ll Over amount.\\nSetting a higher Roll Over amount increases the multiplier and payout on big wins, but also decreases the chances of winning a betting round. By default, this amount is set to 100 for a net multiplier of 2x. You can switch between Roll Over and Roll Under at any time before betting.\"}]},\"mines\":{\"title\":\"Mines\",\"iconSrc\":\"/greenColorDSGN/icons/games/mines.webp\",\"tags\":[\"RTP 99%\",\"Volatility Switch\",\"Original\"],\"sections\":[{\"type\":\"desc\",\"text\":\"Join the Mines fever with one of our most popular and favourite games! Inspired by the classic Minesweeper game, Mines will allow you to simply unlock gems and avoid bombs to increase your payout multiplier.\\n\\nMines is a grid-based gambling game developed by {name} in which players move around a grid, uncovering gems and avoiding bombs! In this Mines game, bets are placed on a 5x5 grid where players can flip tiles to reveal a gem or bomb.\\nDiscovering a gem increases the payout multipliers and allows players to continue the game - choosing additional tiles, a random tile or cashing out. Opening a bomb ends the round with a loss of bet.\\nWith the ability to adjust the number of mines, autobet and cash-out at any point in the game, the gambling experience offered by Mines is unrivalled by any online casino!\"},{\"type\":\"title\",\"text\":\"Mines Gameplay\"},{\"type\":\"desc\",\"text\":\"Players set the amount of bet they will play with during a round of Mines, as well as the number of mines on the playing field, which ranges from 1-24. The game has 25 tiles on which gems and mines can be distributed.\\nThe gameplay is reminiscent of the favourite Minesweeper game, with the placement of mines and gems being random.\"},{\"type\":\"title\",\"text\":\"Modifying the Number of Mines\"},{\"type\":\"desc\",\"text\":\"The number of mines set affects to multiplier paid out to players and controls the volatility of the gameplay. More mines in play lead to more opportunities for a round to end, but also leads to exciting gameplay and higher payouts.\\nThe choice of setting the mines amount reflects the player's appetite for risk and the level of risk they are willing to burden in pursuit of profit and big payouts.\\nOnce the bet amount and number of mines have been set, players can click any number of tiles during the betting round to reveal their contents. Hitting a mine will end the round. However, if a player continues to collect gems they can continue to play.\"},{\"type\":\"title\",\"text\":\"Cashout or Keep Mining\"},{\"type\":\"desc\",\"text\":\"During the phase where players have collected gems and have not tripped any mines yet, the betting interface is modified and they are informed of the Profit on Next Tile and Total Profit in the current betting round.\\nThis helps players evaluate risk and best decide what is the best course of action - cash out winnings or keep going!\"}]},\"crash\":{\"title\":\"Crash\",\"iconSrc\":\"/greenColorDSGN/icons/games/crash.webp\",\"tags\":[\"RTP 99%\",\"Multiplayer\",\"Original\"],\"sections\":[{\"type\":\"desc\",\"text\":\"Predict the multiplier in this quick and easy odds-based game, Crash! Use a variety of strategies to win and take home huge winnings!\\n\\nCrash is a simple game of chance in which the player selects a payout amount for a betting round as the rocket icon flies across the grid. The payout amount increases until the rocket ‘flies away’ and as long as the player's payout amount is less than the crash value, the player can win the payout.\\nThis version of Crash is the pride of {name} Original and is one of the most popular games at our online casino.\"},{\"type\":\"title\",\"text\":\"How to Play Crash\"},{\"type\":\"desc\",\"text\":\"$14\"}]},\"plinko\":{\"title\":\"Plinko\",\"iconSrc\":\"/greenColorDSGN/icons/games/plinko.webp\",\"tags\":[\"RTP 99%\",\"Volatility Switch\",\"Original\"],\"sections\":[{\"type\":\"desc\",\"text\":\"Plinko lets players drop a ball from the top of our triangula
